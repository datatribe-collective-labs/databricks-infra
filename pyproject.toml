[tool.poetry]
name = "databricks-infra"
version = "0.1.0"
description = "Databricks Infrastructure as Code with data engineering course"
authors = ["Chanukya Pekala <chanukya.pekala@gmail.com>"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
databricks-cli = "^0.18.0"
click = "^8.1.0"
pyyaml = "^6.0"
requests = "^2.31.0"
pandas = "^2.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.0"
pytest = "^8.2.2"
pre-commit = "^3.7.1"
mkdocs-material = "^9.6.23"

[tool.poetry.scripts]
# Data generation and utilities
generate-datasets = "src.utils:generate_sample_data"

# User management CLI
user-add = "src.cli:add_user_cmd"
user-add-batch = "src.cli:add_batch_cmd"
user-list = "src.cli:list_users_cmd"
user-remove = "src.cli:remove_user_cmd"
user-status = "src.cli:status_cmd"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]